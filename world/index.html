<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>◈ IN-NO-V8 // WORLD PORTAL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ffaa;
            --flap-bg: #1a1a1a;
            --flap-text: #f0f0f0;
            --panel-border: 1px solid rgba(0, 255, 170, 0.15);
            --clack-speed: 0.06s;
            --hinge-color: #000;
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* INDUSTRIAL CONTAINER */
        .pulse-widget {
            display: flex;
            width: 98vw;
            height: 92vh;
            background: linear-gradient(145deg, #0a0a0a, #000);
            border: var(--panel-border);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.9);
            position: relative;
        }

        @media (max-width: 900px) {
            .pulse-widget { 
                flex-direction: column !important; 
                width: 98vw; 
                height: 98vh; 
                display: flex !important;
            }
            .media-link { 
                display: block !important;
                flex: 0 0 40% !important; 
                width: 100% !important;
                height: 40% !important;
                border-right: none; 
                border-bottom: 1px solid rgba(0, 255, 170, 0.2); 
            }
            .flap-board {
                flex: 1 !important;
                width: 100% !important;
                height: 60% !important;
                overflow-y: auto;
            }
            .flap-grid { 
                grid-template-columns: repeat(10, 1fr) !important; 
                padding: 10px;
                gap: 4px;
            }
            .flap { 
                font-size: 20px !important; 
                font-family: 'Courier New', Courier, monospace !important; 
                background: #000 !important;
                border: 1px solid rgba(0, 255, 170, 0.1);
            }
            .flap .leaf { display: none !important; }
            .flap .top, .flap .bottom { border: none !important; }
        }

        /* MEDIA WINDOW */
        .media-link {
            flex: 1; /* 50/50 Split */
            display: block;
            height: 100%;
            text-decoration: none;
            border-right: 1px solid rgba(0, 255, 170, 0.1);
        }

        .media-window {
            width: 100%;
            height: 100%;
            position: relative;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .media-window img, .media-window video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
            transition: opacity 0.8s ease-in-out, transform 20s linear;
        }

        .media-window:hover img { transform: scale(1.1); }

        .media-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,255,170,0.1);
            backdrop-filter: blur(5px);
            padding: 6px 15px;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            text-transform: uppercase;
            font-weight: 800;
            z-index: 100; /* Above media flaps */
        }

        /* SLOT MACHINE MEDIA ENGINE */
        .media-slot {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 3.0s cubic-bezier(0.1, 0, 0.1, 1); /* Long industrial deceleration */
        }

        .reel img, .reel video {
            width: 100%;
            height: 100%; /* Fill container dynamically */
            min-height: 400px; 
            object-fit: cover;
            filter: contrast(1.1) brightness(0.9);
        }

        .media-window.spinning .reel {
            filter: blur(15px) brightness(1.5) contrast(1.2); /* Intense motion blur */
            scale: 0.95;
        }

        /* SOLARI BOARD SECTION */
        .flap-board {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .board-header {
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(0, 255, 170, 0.4);
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,255,170,0.2);
        }

        .flap-grid {
            display: grid;
            grid-template-columns: repeat(20, 1fr); /* Back to 20 Columns for density */
            gap: 6px;
            padding: 20px;
        }

        /* THE PHYSICAL FLAP - 4 LAYER SYSTEM */
        .flap {
            position: relative;
            width: 100%;
            aspect-ratio: 0.75;
            background: var(--flap-bg);
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: clamp(10px, 1.8vw, 30px); /* Adjusted for 20 columns */
            font-weight: 900;
            text-align: center;
            perspective: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .flap > div {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background: linear-gradient(to bottom, #222, #111);
            color: var(--flap-text);
            display: flex;
            justify-content: center;
        }

        .flap span {
            height: 200%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: var(--flap-text);
        }

        /* ROW COLORS */
        .flap.accent-row span { color: var(--accent-color); text-shadow: 0 0 10px rgba(0,255,170,0.3); font-weight: 800; }
        .flap.white-row span { color: #fff; font-size: 1.1em; }
        .flap.dim-row span { color: rgba(0, 255, 170, 0.6); font-size: 0.85em; letter-spacing: 1px; }
        .flap.quote-row span { color: #aaa; font-style: italic; font-size: 0.9em; }

        /* LAYERS */
        .top {
            top: 0;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(to bottom, #1a1a1a 0%, #111 100%);
            border-bottom: 1px solid rgba(0,0,0,0.5);
            align-items: flex-start;
            z-index: 1;
        }

        .bottom {
            bottom: 0;
            border-radius: 0 0 6px 6px;
            background: linear-gradient(to bottom, #0a0a0a 0%, #1a1a1a 100%);
            border-top: 1px solid rgba(255,255,255,0.05);
            align-items: flex-end;
            z-index: 0;
        }

        /* HINGE PINS */
        .flap::before, .flap::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 2px;
            background: #333;
            z-index: 10;
            transform: translateY(-50%);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .flap::before { left: -4px; border-radius: 2px 0 0 2px; }
        .flap::after { right: -4px; border-radius: 0 2px 2px 0; }

        /* THE ANIMATED LEAF */
        .leaf {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: 2;
            transform-origin: bottom;
            transition: transform var(--clack-speed) linear;
            transform-style: preserve-3d;
        }

        .leaf-front, .leaf-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background: linear-gradient(to bottom, #222, #111);
        }

        .leaf-front {
            align-items: flex-start;
            border-radius: 6px 6px 0 0;
            border-bottom: 1px solid #000;
            background: linear-gradient(to bottom, #1a1a1a 0%, #0a0a0a 100%);
            z-index: 2;
        }

        .leaf-back {
            align-items: flex-end;
            border-radius: 0 0 6px 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: linear-gradient(to bottom, #050505 0%, #1a1a1a 100%);
            transform: rotateX(-180deg);
        }

        /* FIX: Content on the back of the leaf is upside down after flipping, so we pre-rotate it */
        .leaf-back span {
            transform: rotateX(180deg);
        }

        /* ANIMATION STATE */
        .flap.flipping .leaf {
            transform: rotateX(-180deg);
        }

        .pulse-glow {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: var(--accent-color);
            letter-spacing: 2px;
            opacity: 0.7;
        }

        .dot {
            width: 6px;
            height: 100%;
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse-dot 1.5s infinite;
        }

        /* SOUND TOGGLE */
        .sound-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 50;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .sound-toggle:hover { opacity: 1; }
        .sound-toggle svg { width: 20px; height: 20px; fill: var(--accent-color); }

        /* SYNC OVERLAY */
        #syncOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }

        .sync-btn {
            background: none;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 15px 30px;
            font-size: 14px;
            letter-spacing: 5px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0,255,170,0.2);
            transition: all 0.3s ease;
        }

        .sync-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 40px var(--accent-color);
        }

    </style>
</head>
<body>

    <div id="syncOverlay">
        <button class="sync-btn" onclick="startSync()">◈ ACTIVATE NEURAL SYNC ◈</button>
    </div>

    <div class="pulse-widget">
        <!-- Media Section -->
        <a href="https://feed.in-no-v8.com" target="_blank" class="media-link">
            <div class="media-window" id="mediaContainer">
                <div class="media-overlay">Neural Ingest // Live</div>
                <div class="media-slot" id="mediaSlot">
                    <div class="reel" id="reel">
                        <img src="sample.png" alt="Reel Start">
                    </div>
                </div>
            </div>
        </a>

        <!-- Solari Board Section -->
        <div class="flap-board">
            <div class="board-header">◈ IN-NO-V8 // STUDIO ARRIVALS ◈</div>
            <div class="flap-grid" id="flapRow">
                <!-- Flaps generated by JS -->
            </div>
            <div class="sound-toggle" id="soundToggle" onclick="toggleMute()">
                <svg viewBox="0 0 24 24" id="speakerIcon">
                    <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />
                </svg>
            </div>
            <div class="pulse-glow">
                <div class="dot"></div>
                SYSTEM ONLINE
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const SUPABASE_URL = "https://dzgyqrnmsnhqaiqthzok.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR6Z3lxcm5tc25ocWFpcXRoem9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyOTQwNzYsImV4cCI6MjA5Mzg3MDA3Nn0.sUWGeR3_Vd1Xm40lRoA0q1nXUjaMK_BbXXv3SBkZ6cY";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const flapRow = document.getElementById('flapRow');
        const mainMedia = document.getElementById('mainMedia');
        
        const CHARS = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789◈:#-.\"/(){},'!?[]@_%&".split("");
        const BOARD_SIZE = 240; // 12x20 grid

        // --- HIGH-PERFORMANCE AUDIO ENGINE (LOCAL-SAFE) ---
        const flapAudio = new Audio('flap.mp3');
        flapAudio.preload = 'auto';
        
        function playClack() {
            if (!syncStarted) return;
            // Native seek + play for lowest latency over file://
            flapAudio.currentTime = 0;
            flapAudio.play().catch(e => console.log("◈ [AUDIO] Playback error:", e));
        }

        let syncStarted = false;

        function startSync() {
            document.getElementById('syncOverlay').style.opacity = '0';
            setTimeout(() => document.getElementById('syncOverlay').style.display = 'none', 500);
            
            // "Silent Wakeup" - Primes the hardware for zero-lag
            flapAudio.volume = 0;
            flapAudio.play().then(() => {
                flapAudio.pause();
                flapAudio.currentTime = 0;
                flapAudio.volume = 1.0;
                console.log("◈ [AUDIO] Industrial engine primed.");
            });
            
            syncStarted = true;
            fetchInitial();
        }

        function toggleMute() {
            flapAudio.muted = !flapAudio.muted;
            const icon = document.getElementById('speakerIcon');
            if (flapAudio.muted) {
                icon.innerHTML = '<path d="M12,4L9.91,6.09L12,8.18V4M14.92,10.12L17.03,8.01C15.93,7.15 14.7,6.48 13.39,6.04V8.19C13.92,8.34 14.44,8.57 14.92,8.88M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.48,12.43 16.5,12.22 16.5,12M19.74,15.11L21.14,16.51C21.8,15.13 22.18,13.61 22.18,12C22.18,8.23 19.87,4.96 16.58,3.58V5.72C18.71,6.92 20.18,9.27 20.18,12C20.18,13.1 19.95,14.15 19.74,15.11M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L14.73,16C14.07,16.5 13.39,16.92 12.64,17.22V19.37C13.93,19.01 15.12,18.42 16.18,17.71L18.73,20.27L20,19L4.27,3Z" />';
                document.getElementById('soundToggle').style.opacity = '0.3';
            } else {
                icon.innerHTML = '<path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z" />';
                document.getElementById('soundToggle').style.opacity = '0.8';
            }
        }

        // Init Board
        let currentText = "".padEnd(BOARD_SIZE, " ");
        createFlaps();

        function createFlaps() {
            flapRow.innerHTML = "";
            for (let i = 0; i < BOARD_SIZE; i++) {
                const flap = document.createElement('div');
                const row = Math.floor(i / 20);
                flap.className = 'flap';
                
                // Color Assignments
                if (row === 0) flap.classList.add('accent-row'); 
                if (row >= 1 && row <= 3) flap.classList.add('white-row'); 
                if (row === 4) flap.classList.add('dim-row'); 
                if (row >= 6) flap.classList.add('quote-row'); 
                
                flap.innerHTML = `
                    <div class="top"><span> </span></div>
                    <div class="bottom"><span> </span></div>
                    <div class="leaf">
                        <div class="leaf-front"><span> </span></div>
                        <div class="leaf-back"><span> </span></div>
                    </div>
                `;
                flapRow.appendChild(flap);
            }
        }

        async function animateMedia(newUrl) {
            const container = document.getElementById('mediaContainer');
            const reel = document.getElementById('reel');
            const h = container.offsetHeight;
            
            // 1. Build "Jackpot" Reel 
            for (let i = 0; i < 5; i++) {
                const randomPulse = feedPool[Math.floor(Math.random() * feedPool.length)];
                const randomUrl = (randomPulse.mood_tag || "").split('|')[2] || "sample.png";
                const dummy = document.createElement('img');
                dummy.src = randomUrl;
                dummy.style.height = h + 'px'; // Precise height
                reel.appendChild(dummy);
            }

            // 2. Add Target
            let targetElement;
            const isVideo = newUrl.toLowerCase().endsWith('.mp4');
            if (isVideo) {
                targetElement = document.createElement('video');
                targetElement.src = newUrl;
                targetElement.autoplay = true;
                targetElement.muted = true;
                targetElement.loop = true;
                targetElement.playsInline = true;
            } else {
                targetElement = document.createElement('img');
                targetElement.src = newUrl;
            }
            targetElement.style.height = h + 'px';
            reel.appendChild(targetElement);

            // 3. Trigger Spin
            container.classList.add('spinning');
            const totalItems = reel.children.length;
            reel.style.transform = `translateY(-${(totalItems - 1) * h}px)`;

            // 4. Cleanup and Reset
            setTimeout(() => {
                container.classList.remove('spinning');
                // Snap to target
                while (reel.children.length > 1) reel.removeChild(reel.firstChild);
                reel.style.transition = 'none';
                reel.style.transform = 'translateY(0)';
                void reel.offsetWidth; 
                reel.style.transition = '';
            }, 3100); // Slightly longer than CSS transition
        }

        async function updateBoard(data) {
            const isMobile = window.innerWidth <= 900;
            const COLS = isMobile ? 10 : 20;
            const ROWS = isMobile ? 24 : 12; // More rows on mobile to fit same data
            
            let rows = new Array(ROWS).fill("".padEnd(COLS, " "));
            
            // 1. Parse Piped Data
            const parts = (data.mood_tag || "").split('|');
            const mood = (parts[0] || "ONLINE").toUpperCase();
            const subLabel = (parts[1] || "").toUpperCase();
            const imageUrl = parts[2] || "sample.png";
            const software = (parts[3] || "").toUpperCase();
            const quote = (parts[4] || "").toUpperCase();
            
            // Row 0: Project + Action
            rows[0] = ((data.project_name || "") + " " + (data.action_label || "")).substring(0, COLS).padEnd(COLS, " ");
            
            // Row 1-2: Context
            rows[1] = subLabel.substring(0, COLS).padEnd(COLS, " ");
            rows[2] = software.substring(0, COLS).padEnd(COLS, " ");
            
            // Row 4: Mood
            rows[4] = mood.substring(0, COLS).padEnd(COLS, " ");
            
            // Quote/Details Wrap (Dynamic based on remaining rows)
            const quoteWords = quote.split(" ");
            let r = 6, line = "";
            quoteWords.forEach(w => {
                if (r >= ROWS) return;
                if ((line + w).length > COLS) {
                    rows[r] = line.padEnd(COLS, " ");
                    r++; line = w + " ";
                } else { line += w + " "; }
            });
            if (r < ROWS) rows[r] = line.padEnd(COLS, " ");

            // Update Media with Mechanical Flip
            animateMedia(imageUrl);

            const formatted = rows.join("");
            const flaps = document.querySelectorAll('.flap');

            // 1. Stagger Parameters
            const FLIP_SPEED = 25; 
            const maxDelay = 1000; 

            // 2. Fire Sound
            playClack();

            // 3. Vertical Stagger Launch
            for (let i = 0; i < BOARD_SIZE; i++) {
                if (formatted[i] !== currentText[i]) {
                    const row = Math.floor(i / COLS);
                    const col = i % COLS;
                    
                    // Strong vertical stagger: Each row waits for the previous one
                    const launchDelay = (row / ROWS) * maxDelay; 

                    setTimeout(() => {
                        animateFlap(flaps[i], currentText[i], formatted[i], FLIP_SPEED);
                    }, launchDelay); 
                }
            }
            currentText = formatted;
        }

        function animateFlap(element, startChar, endChar, intervalMs) {
            let currentIndex = CHARS.indexOf(startChar);
            if (currentIndex === -1) currentIndex = 0;
            
            const targetIndex = CHARS.indexOf(endChar);
            // Safety: If character not in set, snap to it immediately
            if (targetIndex === -1) {
                element.querySelector('.bottom span').innerText = endChar;
                element.querySelector('.top span').innerText = endChar;
                element.querySelector('.leaf-front span').innerText = endChar;
                return;
            }
            
            const animate = () => {
                const char = CHARS[currentIndex];
                const nextIndex = (currentIndex + 1) % CHARS.length;
                const nextChar = CHARS[nextIndex];

                // 1. Prepare layers
                // Top background shows where we are going
                element.querySelector('.top span').innerText = nextChar;
                // Bottom background shows where we are currently (will be covered)
                element.querySelector('.bottom span').innerText = char;
                // Leaf front shows current top (will flip down)
                element.querySelector('.leaf-front span').innerText = char;
                // Leaf back shows next bottom (will land on bottom)
                element.querySelector('.leaf-back span').innerText = nextChar;

                // 2. Trigger Flip
                element.classList.remove('flipping');
                void element.offsetWidth; 
                element.classList.add('flipping');

                currentIndex = nextIndex;

                // 3. Cleanup after this specific flip
                setTimeout(() => {
                    // Update the resting state to the new character
                    element.querySelector('.bottom span').innerText = nextChar;
                    element.querySelector('.leaf-front span').innerText = nextChar;
                    element.classList.remove('flipping');
                    
                    if (currentIndex !== targetIndex) {
                        setTimeout(animate, 10); // Minimal gap between mechanical clacks
                    }
                }, 50); // Matches the new 0.06s clack-speed (with 10ms buffer)
            };
            
            animate();
        }

        let feedPool = [];
        let poolIndex = 0;

        // --- FETCH FROM FTP STATIC JSON (zero Supabase egress) ---
        async function fetchInitial() {
            // Read the static snapshot pushed by heartbeat.py on every pulse
            try {
                const res = await fetch('https://in-no-v8.world/vault/studio_heartbeat.json?t=' + Date.now());
                const data = await res.json();
                if (data && data.length > 0) {
                    feedPool = data.slice(0, 5);
                    startDynamicLoop();
                } else {
                    updateBoard({ project_name: "WORLD", action_label: "CONNECTING...", mood_tag: "OFFLINE|STANDBY|sample.png|SYSTEM|NO DATA FOUND|0" });
                }
            } catch(e) {
                console.warn('◈ [PORTAL] Static feed unavailable, retrying in 30s...', e);
                setTimeout(fetchInitial, 30000);
            }
        }

        function startDynamicLoop() {
            if (!feedPool.length) return;
            
            const nextPulse = () => {
                if (!syncStarted) return setTimeout(nextPulse, 2000); 
                
                const data = feedPool[poolIndex];
                updateBoard(data);
                
                poolIndex = (poolIndex + 1) % feedPool.length;
                setTimeout(nextPulse, 10000); 
            };
            
            nextPulse();
        }

        // Realtime Override: If a NEW creative pulse arrives, jump to it immediately
        supabaseClient
            .channel('public:studio_heartbeat')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'studio_heartbeat' }, (payload) => {
                const data = payload.new;
                if (data.project_name !== '[SYSTEM_STATUS]') {
                    feedPool.unshift(data); 
                    updateBoard(data);
                }
            })
            .subscribe();
        
    </script>
</body>
