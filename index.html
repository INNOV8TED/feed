<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IN-NO-V8 Live Status | Studio Pulse</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@300;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060608;
            --text-color: #e8e4dc;
            --accent-color: #00ff88;
            --card-bg: rgba(20, 20, 25, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', sans-serif;
            --font-display: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --glow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        /* DYNAMIC PROJECT THEMES */
        .theme-lanna { --accent-color: #d4af37; --bg-color: #120d0a; --glow: 0 0 25px rgba(212, 175, 55, 0.3); }
        .theme-acam { --accent-color: #00d9ff; --bg-color: #050a0f; --glow: 0 0 25px rgba(0, 217, 255, 0.3); }
        .theme-scarlett { --accent-color: #ff3366; --bg-color: #0f0508; --glow: 0 0 25px rgba(255, 51, 102, 0.3); }
        .theme-focused { --accent-color: #00ff88; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            transition: background-color 1.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* CRT SCANLINE OVERLAY */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 9999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            opacity: 0.4;
        }

        header {
            width: 100%;
            padding: 50px 20px;
            text-align: center;
            position: relative;
        }

        .header-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 200px;
            background: radial-gradient(circle at center, var(--accent-color), transparent 70%);
            opacity: 0.05;
            filter: blur(50px);
            transition: all 1.5s ease;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 300;
            letter-spacing: 8px;
            margin: 0;
            text-transform: uppercase;
            font-size: 1rem;
            color: var(--accent-color);
            text-shadow: var(--glow);
        }

        .container {
            max-width: 900px;
            width: 100%;
            padding: 0 20px 100px;
            box-sizing: border-box;
            z-index: 10;
        }

        .pulse-stream {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .pulse-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            backdrop-filter: blur(20px);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .pulse-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .pulse-card.milestone {
            border-left: 4px solid var(--accent-color);
            box-shadow: var(--glow);
        }

        .sprite-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }

        .sprite {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .sprite-focused { background-image: url('stephen_focus.png'); }
        .sprite-creative { background-image: url('stephen_hacker.png'); }
        .sprite-artistic { background-image: url('stephen_artist.png'); }
        .sprite-success { background-image: url('stephen_celebration.png'); }
        .sprite-lanna_special { background-image: url('stephen_lanna.png'); }
        .sprite-musician { background-image: url('stephen_synth.png'); }
        .sprite-burlesque { background-image: url('stephen_burlesque.png'); }
        .sprite-deer { background-image: url('stephen_deer.png'); }
        .sprite-podcast { background-image: url('stephen_podcast.png'); }
        .sprite-focus { background-image: url('stephen_focus.png'); }
        
        /* Pixel Art Sprites with Transparency Fix */
        .sprite-hacker-pixel { background-image: url('stephen_hacker_pixel.png'); mix-blend-mode: screen; }
        .sprite-synth-pixel { background-image: url('stephen_synth_pixel1.png'); mix-blend-mode: screen; }
        .sprite-synth-pixel2 { background-image: url('stephen_synth_pixel2.png'); mix-blend-mode: screen; }
        .sprite-synth-pixel3 { background-image: url('stephen_synth_pixel3.png'); mix-blend-mode: screen; }
        .sprite-rand5 { background-image: url('stephen_rand5.png'); mix-blend-mode: screen; }
        .sprite-rand6 { background-image: url('stephen_rand6.png'); mix-blend-mode: screen; }
        .sprite-deer-pixel { background-image: url('stephen_deer_pixel.png'); mix-blend-mode: screen; }
        .sprite-scarlett-pixel { background-image: url('stephen_scarlett_pixel.png'); mix-blend-mode: screen; }
        .sprite-scarlett-pixel-full { background-image: url('stephen_scarlett_pixel_full.png'); mix-blend-mode: screen; }
        .sprite-deer-music-pixel { background-image: url('stephen_deer_music_pixel.png'); mix-blend-mode: screen; }

        .sprite-glitch {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain;
            opacity: 0.3;
            mix-blend-mode: color-dodge;
            animation: spriteGlitch 3s infinite;
            display: none;
        }

        @keyframes spriteGlitch {
            0% { transform: translate(0); }
            2% { transform: translate(2px, -2px); filter: hue-rotate(90deg); }
            4% { transform: translate(-2px, 2px); }
            6% { transform: translate(0); }
        }

        .details {
            flex-grow: 1;
        }

        .action-label {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 500;
            margin: 0 0 8px 0;
            display: block;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .project-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .project-name {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-color);
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.03);
            padding: 4px 10px;
            border-radius: 2px;
        }

        .timestamp {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            opacity: 0.3;
            text-transform: uppercase;
        }

        .typewriter {
            overflow: hidden;
            border-right: 2px solid var(--accent-color);
            white-space: nowrap;
            animation: typing 1.5s steps(30, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--accent-color); } }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--accent-color);
            border-radius: 50%;
            margin-right: 15px;
            box-shadow: 0 0 15px var(--accent-color);
            vertical-align: middle;
        }

        /* BACKGROUND DECORATION */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--border-color) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 100px 100px;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    <header>
        <div class="header-bg" id="header-glow"></div>
        <div id="live-indicator">
            <span class="status-dot"></span>
            <h1>Studio Pulse // Live Feed</h1>
        </div>
    </header>

    <div class="container">
        <div id="pulse-stream" class="pulse-stream">
            <!-- Pulses will appear here -->
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://dzgyqrnmsnhqaiqthzok.supabase.co';
        const supabaseKey = 'sb_publishable_TZOHRPfCaaV1AyIVErNknw_IzEsmhtQ'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const streamContainer = document.getElementById('pulse-stream');

        function getThemeClass(projectName) {
            const name = projectName.toUpperCase();
            if (name.includes('LANNA')) return 'theme-lanna';
            if (name.includes('A-CAM')) return 'theme-acam';
            if (name.includes('SCARLETT')) return 'theme-scarlett';
            return 'theme-focused';
        }

        function getSpriteClass(data) {
            const name = (data.project_name || '').toUpperCase();
            const action = (data.action_label || '').toUpperCase();
            const id = data.id || 0;
            
            // Define Category Pools
            const pools = {
                DEER: ['sprite-deer-pixel', 'sprite-deer-music-pixel', 'sprite-deer'],
                SCARLETT: ['sprite-scarlett-pixel', 'sprite-scarlett-pixel-full', 'sprite-burlesque'],
                MUSIC: ['sprite-synth-pixel', 'sprite-synth-pixel2', 'sprite-synth-pixel3', 'sprite-musician'],
                HACKER: ['sprite-hacker-pixel', 'sprite-creative', 'sprite-focused'],
                GENERAL: ['sprite-rand5', 'sprite-rand6', 'sprite-focus']
            };

            // 1. Project-Based Routing to Pools
            if (name.includes('LANNA')) return 'sprite-lanna_special';
            if (name.includes('SCARLETT')) return pools.SCARLETT[id % pools.SCARLETT.length];
            if (name.includes('DEER')) return pools.DEER[id % pools.DEER.length];
            if (name.includes('DFP')) return pools.GENERAL[id % pools.GENERAL.length];
            
            // 2. Workflow-Based Routing to Pools
            if (action.includes('EDIT')) return pools.HACKER[id % pools.HACKER.length];
            if (action.includes('AUDIO') || action.includes('SYNTH')) return pools.MUSIC[id % pools.MUSIC.length];
            
            // 3. Absolute Fallback
            return pools.GENERAL[id % pools.GENERAL.length];
        }

        function createPulseCard(data, isInitial = false) {
            const card = document.createElement('div');
            card.className = `pulse-card ${data.is_milestone ? 'milestone' : ''}`;
            
            // Use the permanent database timestamp!
            const timeObj = data.created_at ? new Date(data.created_at) : new Date();
            const timeStr = timeObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            const labelClass = isInitial ? 'action-label' : 'action-label typewriter';
            
            card.innerHTML = `
                <div class="sprite-wrapper">
                    <div class="sprite ${getSpriteClass(data)}"></div>
                    <div class="sprite-glitch ${getSpriteClass(data)}"></div>
                </div>
                <div class="details">
                    <div class="project-meta">
                        <span class="project-name">${data.project_name}</span>
                        <span class="timestamp">${timeStr}</span>
                    </div>
                    <span class="${labelClass}">${data.action_label}</span>
                </div>
            `;
            
            return card;
        }

        const displayedPulseFingerprints = new Set();

        function updateUI(data, isInitial = false) {
            if (!data.id) return;
            
            // Coarsen Fingerprint: Group by Action + Time (ignoring Project Name for collapsing)
            const timeObj = new Date(data.created_at || Date.now());
            const roundedTime = timeObj.toISOString().substring(0, 16); 
            const fingerprint = `${data.action_label}|${roundedTime}`;
            
            if (displayedPulseFingerprints.has(fingerprint)) return;
            displayedPulseFingerprints.add(fingerprint);
            
            document.body.className = getThemeClass(data.project_name);
            
            const newCard = createPulseCard(data, isInitial);
            streamContainer.prepend(newCard);
            
            if (streamContainer.children.length > 8) {
                streamContainer.removeChild(streamContainer.lastChild);
            }
        }

        // 1. Initial Load (History)
        supabaseClient.from('studio_heartbeat')
            .select('*')
            .order('created_at', { ascending: false }) // Use the new column!
            .limit(8)
            .then(({data}) => { 
                if(data) data.reverse().forEach(pulse => updateUI(pulse, true));
            });

        // 2. Real-time Subscription
        supabaseClient.channel('public:studio_heartbeat')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'studio_heartbeat' }, payload => {
                updateUI(payload.new, false);
            }).subscribe();
    </script>
</body>
</html>
